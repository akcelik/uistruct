<strct-shell skipLinkTarget="main-content">
  <strct-header>
    <a class="brand" routerLink="/">
      <strct-icon name="hexagon" [size]="22" [strokeWidth]="1.4" />
      <div class="brand__text">
        <strong>UIStruct</strong>
        <span>Component Library</span>
      </div>
    </a>

    <span class="grow"></span>

    <!-- Below 600px these move into the header's own "More" menu; the
         searchbox and the theme switcher stay, because each opens a surface
         of its own. -->
    <ng-container *strctHeaderAction="{ label: 'Get started', icon: 'rocket', run: goStarted }">
      <a strct-button variant="flat" size="sm" routerLink="/get-started">Get started</a>
    </ng-container>
    <ng-container *strctHeaderAction="{ label: 'Components', icon: 'grid', run: goComponents }">
      <a strct-button variant="flat" size="sm" routerLink="/components/button">Components</a>
    </ng-container>

    <ng-container *strctHeaderAction="{ label: 'Search', overflow: 'never' }">
      <strct-searchbox
        class="hdr-search"
        trigger
        hint="⌘K"
        ariaLabel="Ctrl or Cmd K"
        (activated)="openPalette()"
      />
    </ng-container>

    <!-- The widest trigger in this header (a segmented control): on a phone
         it is drawn inside the More menu instead, template and all. -->
    <ng-container *strctHeaderAction="{ label: 'Theme' }">
      <strct-theme-switcher />
    </ng-container>

    <ng-container *strctHeaderAction="{ label: 'GitHub', icon: 'code', run: goGithub }">
      <a
        class="ghbtn"
        href="https://github.com/akcelik/uistruct"
        target="_blank"
        rel="noreferrer"
        aria-label="GitHub"
      >
        <strct-icon name="code" [size]="16" />
      </a>
    </ng-container>
  </strct-header>

  @if (showSidebar()) {
    <strct-vertical-nav closeButton closeLabel="Close navigation">
      <div class="side">
        <div class="rail">
          @for (group of groups; track group.id) {
            <strct-nav-item
              [active]="isActiveGroup(group.id)"
              [label]="group.label"
              [routerLink]="group.items[0].path"
            >
              <strct-icon [name]="group.icon" [size]="17" [strokeWidth]="1.4" />
            </strct-nav-item>
          }
        </div>

        <!-- The whole panel is the navigation landmark, named by its visible
             group title: the title is inside a landmark, and a screen reader's
             landmark list tells it from the breadcrumb and prev / next navs. -->
        <nav class="panel" [attr.aria-labelledby]="panelTitleId">
          <div class="panel__title" [id]="panelTitleId">{{ activeGroup().label }}</div>
          <div class="panel__list">
            @for (item of activeGroup().items; track item.path) {
              <a
                class="panel__item"
                [class.is-active]="isActiveItem(item.path)"
                [attr.aria-current]="isActiveItem(item.path) ? 'page' : null"
                [routerLink]="item.path"
              >
                {{ item.label }}
              </a>
            }
          </div>
        </nav>
      </div>
    </strct-vertical-nav>
  }

  <main id="main-content" class="content" [class.content--wide]="!showSidebar()">
    <router-outlet />
  </main>

  <strct-footer>
    <span>UIStruct v{{ version }}</span>
    <span class="dot-sep"></span>
    <span>{{ count }} components</span>
    <span class="grow"></span>
    <span>{{ themeLabel() }}</span>
  </strct-footer>
</strct-shell>

<strct-toast-outlet />
<app-command-palette />
<strct-hotkeys-help />
