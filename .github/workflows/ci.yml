name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The docs pages' import lines are copied verbatim into consumers' code,
      # so a name the package no longer exports is a compile error for them.
      # 6.0.1 found `StrctContextMenu` still listed after 6.0 removed it.
      - name: Assert the docs describe the library that ships
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-docs.mjs
      # A component stylesheet may not invent a size. FR-67 counted 190 literal
      # font-sizes against 75 token references — the scale existed and nothing
      # consulted it. The gate holds what 6.5.0 converted and lets the list of
      # sizes the scale cannot yet express only shrink.
      - name: Assert every size comes from the scale
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/token-scale.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build strct

  a11y-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build showcase
      - name: Run axe-core a11y smoke (+ page screenshots)
        run: node scripts/a11y-smoke.mjs
      # Geometry only a browser can answer: a column is the width it was
      # given, the table stays inside its container, and a single-line row is
      # one line tall whatever it holds. jsdom has no layout, so the specs
      # cover the plumbing and this covers the claim (BUG-62-01).
      - name: Assert the grid's columns obey their widths
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/grid-layout.mjs
      # One height per size: every control, every size, with and without an
      # icon, disabled, loading, in three palettes — measured against the
      # token it is supposed to be (FR-63-04).
      - name: Assert every control is the height its size asks for
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/control-height.mjs
      # FR-69-04: a glyph whose job is to be told apart from the one beside it.
      # Measured at 14px against a floor the set's own closest accepted pair
      # (lock/unlock, 2.28%) sets. The first backup/restore drawing scored
      # 2.32% and was redrawn.
      - name: Assert a new glyph can be told apart at the size it is read at
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/glyph-distinct.mjs
      # FR-69-02: a grid bounded to the space left in its pane, read at two
      # window heights because a number right for one and wrong for every
      # other is the whole item. 15 checks.
      - name: Assert a fill grid ends where its pane ends
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/fill-height.mjs
      # Weight carries rank, a field is a recess, severity rides on surface and
      # a card groups by tone — FR-67-04/05/06/08, read from the rendered page.
      # 19 of its 28 checks fail on 6.5.0.
      - name: Assert the weight ladder holds
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/weight-ladder.mjs
      # The library's dev-mode diagnostics are for consumers, so the library's
      # own showcase must never trigger one. Production compiles them out, so
      # this needs the development build.
      - run: npx ng build showcase --configuration development
      - name: Assert the showcase logs no [strct] diagnostics
        run: node scripts/dev-warnings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-artifacts
          path: a11y-artifacts/

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build showcase
      - name: Compare pages against committed baselines
        run: node scripts/visual-regression.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: visual-artifacts/
