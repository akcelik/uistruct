# Publishes @akcelik/strct to npm when a v* tag is pushed.
# Requires the NPM_TOKEN repository secret (an npm automation token).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npx ng build strct
      - name: Publish
        working-directory: dist/strct
        # Idempotent: a tag re-push (or a version already published
        # manually) skips the publish instead of failing the run.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@akcelik/strct@$VERSION" version 2>/dev/null; then
            echo "@akcelik/strct@$VERSION already on npm — skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
